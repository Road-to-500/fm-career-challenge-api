name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build API
        run: dotnet build FmCareerChallenge.Api.csproj --configuration Release
      - name: Run unit tests
        run: dotnet test tests/FmCareerChallenge.UnitTests/FmCareerChallenge.UnitTests.csproj --configuration Release
      - name: Run PostgreSQL integration tests
        run: dotnet test tests/FmCareerChallenge.IntegrationTests/FmCareerChallenge.IntegrationTests.csproj --configuration Release
